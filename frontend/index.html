<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOFabrik</title>
    <style>
      :root {
        color-scheme: dark;
        --iofabrik-bg: #0f1720;
        --iofabrik-panel: rgba(16, 24, 32, 0.92);
        --iofabrik-border: rgba(130, 148, 168, 0.18);
        --iofabrik-border-strong: rgba(130, 148, 168, 0.28);
        --iofabrik-text: #edf3f8;
        --iofabrik-text-muted: #9caec0;
        --iofabrik-primary: #3b82f6;
        --iofabrik-primary-hover: #60a5fa;
        --iofabrik-button-text: #eff6ff;
        --iofabrik-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(70, 99, 129, 0.22), transparent 32%),
          linear-gradient(180deg, #101821 0%, #0c1218 100%);
        color: var(--iofabrik-text);
        font-family: 'SF Pro Text', 'Segoe UI', sans-serif;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      .iofabrik-startup-shell {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 34%),
          linear-gradient(180deg, rgba(12, 18, 24, 0.92), rgba(12, 18, 24, 0.98));
      }

      .iofabrik-startup-shell[data-visible='true'] {
        display: flex;
      }

      .iofabrik-recovery-card {
        display: flex;
        width: min(480px, 100%);
        flex-direction: column;
        gap: 18px;
        padding: 24px;
        border: 1px solid var(--iofabrik-border-strong);
        border-radius: 16px;
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 30%),
          linear-gradient(180deg, rgba(19, 27, 36, 0.98), rgba(14, 20, 28, 0.98));
        box-shadow: var(--iofabrik-shadow);
      }

      .iofabrik-recovery-card h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .iofabrik-recovery-card p {
        margin: 0;
        color: var(--iofabrik-text-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .iofabrik-recovery-stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .iofabrik-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding-top: 2px;
      }

      .iofabrik-button {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 11px 16px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
      }

      .iofabrik-button:hover {
        transform: translateY(-1px);
      }

      .iofabrik-button:focus-visible,
      .iofabrik-button-tertiary:focus-visible {
        outline: 2px solid rgba(96, 165, 250, 0.8);
        outline-offset: 2px;
      }

      .iofabrik-button-primary {
        background: var(--iofabrik-primary);
        color: var(--iofabrik-button-text);
      }

      .iofabrik-button-primary:hover {
        background: var(--iofabrik-primary-hover);
      }

      .iofabrik-button-tertiary {
        border-color: transparent;
        background: transparent;
        color: var(--iofabrik-text-muted);
        padding-left: 0;
        padding-right: 0;
        width: fit-content;
      }

      .iofabrik-button-tertiary:hover {
        color: var(--iofabrik-text);
        background: transparent;
      }

      .iofabrik-log-box {
        border: 1px solid var(--iofabrik-border);
        border-radius: 12px;
        background: var(--iofabrik-panel);
      }

      .iofabrik-log-label {
        display: block;
        padding: 12px 14px 0;
        color: var(--iofabrik-text);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .iofabrik-log-box pre {
        margin: 0;
        padding: 12px 14px 14px;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: #d5deea;
        font-family: 'SFMono-Regular', 'SF Mono', 'Cascadia Code', Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .iofabrik-startup-shell {
          padding: 18px;
        }

        .iofabrik-recovery-card {
          padding: 22px;
        }

        .iofabrik-recovery-card h1 {
          font-size: 24px;
        }
      }

      @media (max-width: 640px) {
        .iofabrik-startup-shell {
          padding: 14px;
        }

        .iofabrik-actions {
          flex-direction: column;
        }

        .iofabrik-button {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-recovery-shell" class="iofabrik-startup-shell" data-visible="false" aria-live="polite">
      <section class="iofabrik-recovery-card" aria-labelledby="startup-recovery-title">
        <div class="iofabrik-recovery-stack">
          <div>
            <h1 id="startup-recovery-title">Something went wrong</h1>
          </div>

          <p id="startup-recovery-body">Your data is safe.</p>

          <div class="iofabrik-actions">
            <button id="startup-restart-button" type="button" class="iofabrik-button iofabrik-button-primary">Restart</button>
            <button id="startup-copy-reference-button" type="button" class="iofabrik-button iofabrik-button-tertiary">Copy reference</button>
          </div>

          <div class="iofabrik-log-box" aria-labelledby="startup-log-label">
            <span id="startup-log-label" class="iofabrik-log-label">Log</span>
            <pre id="startup-technical-details-body"></pre>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/app/startup/installStartupGuard.ts"></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
